<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 176" width="720" height="176" role="img" aria-label="Garin Ravindra — mobile and frontend developer, with an animated ASCII cat">
<style>
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 14px; fill: #8b949e; }
  .acc, .eye { fill: #d4a24c; }
  .name { font-size: 18px; font-weight: 600; fill: #e6edf3; letter-spacing: .5px; }
  .c { opacity: 0; animation: show .01s linear forwards; }
  .cur { animation: blink 1s steps(1) infinite; }
  .f { opacity: 0; animation: cat 3.60s steps(1) infinite; }
  @keyframes show { to { opacity: 1; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes cat { 0% { opacity: 1; } 12.500% { opacity: 0; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .c { opacity: 1; animation: none; }
    .cur { animation: none; }
    .f { animation: none; } .f:first-of-type { opacity: 1; }
  }
</style>
